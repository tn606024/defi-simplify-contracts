name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Format, build, test, coverage, and reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify Foundry version
        run: make check-foundry

      - name: Verify dependency revisions
        run: make check-dependencies

      - name: Check formatting
        run: make format

      - name: Verify contract ABIs, storage layouts, and direct artifacts
        run: make check-artifacts

      - name: Run non-fork tests
        run: make test

      - name: Check gas snapshot
        run: make snapshot

      - name: Enforce production coverage thresholds
        run: make coverage

      - name: Check reproducible artifacts
        run: make reproducible

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify dependency revisions
        run: make check-dependencies

      - name: Install pinned Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.4

      - name: Run dependency-inclusive Slither review
        run: make slither-review

      - name: Reject project-owned high-severity findings
        run: make slither-gate
